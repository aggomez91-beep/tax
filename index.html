<style>

input[type=number],select{font-family:inherit;font-size:15px;border:2px solid #cfcfcf;border-radius:8px;padding:5px 8px;background:#fff;color:#111;max-width:130px}

/* participante */
#pj{position:fixed;inset:0;background:linear-gradient(160deg,#046A38 0%,#023d20 100%);color:#fff;overflow:auto;z-index:50;font-family:'Open Sans','Segoe UI',Arial,sans-serif;-webkit-text-size-adjust:100%}
.pj-off{display:none;position:fixed;left:0;right:0;top:0;background:#c8102e;color:#fff;text-align:center;padding:6px;font-weight:800;font-size:14px;z-index:60}
.pw2{max-width:560px;margin:0 auto;min-height:100%;padding:16px 16px 28px;display:flex;flex-direction:column;gap:12px}
.pj-top{display:flex;justify-content:space-between;align-items:center;gap:10px;font-size:14px;font-weight:700}.pj-badge{background:var(--g);color:#000;border-radius:14px;padding:4px 12px;font-size:12px;font-weight:800;letter-spacing:1px}
.pj-nm{flex:1;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap;text-align:center;opacity:.9}
.pj-clock{background:rgba(0,0,0,.35);border-radius:14px;padding:4px 12px;font-weight:800;font-size:16px;font-variant-numeric:tabular-nums;min-width:20px}.pj-clock:empty{display:none}.pj-clock.low{background:var(--red)}
.pw2 h1{font-size:30px;line-height:1.15;font-weight:800}.pw2 p{font-size:17px;line-height:1.4;opacity:.92}
.pj-in{width:100%;font-size:20px;border:3px solid #fff;border-radius:14px;padding:14px 16px;font-family:inherit;color:#111}.pj-in:focus{outline:none;border-color:var(--g)}
.pj-err{color:#ffc0c8;font-weight:700;min-height:20px;font-size:15px}
.pj-btn{background:var(--g);color:#000;border:0;border-radius:30px;padding:16px;font-size:19px;font-weight:800;cursor:pointer;width:100%;font-family:inherit}.pj-btn:active{transform:scale(.98)}
.pj-c{flex:1;display:flex;flex-direction:column;align-items:center;justify-content:center;text-align:center;gap:12px;padding-bottom:30px}
.pj-dots{display:flex;gap:8px;justify-content:center;margin:6px 0}.pj-dots i{width:12px;height:12px;border-radius:50%;background:var(--g);animation:dot 1.2s infinite both}.pj-dots i:nth-child(2){animation-delay:.2s}.pj-dots i:nth-child(3){animation-delay:.4s}
@keyframes dot{0%,80%,100%{transform:scale(.4);opacity:.4}40%{transform:scale(1);opacity:1}}
.pj-pill{background:rgba(255,255,255,.16);border-radius:24px;padding:9px 20px;font-weight:700;font-size:16px}.pj-pill b{color:var(--g)}
.pj-pts{font-size:34px;font-weight:800;color:var(--g)}
.pj-ans{background:#fff;color:#111;border-radius:14px;padding:12px 16px;font-size:19px;font-weight:700;width:100%}.pj-ans small{display:block;font-size:12px;color:var(--dg);text-transform:uppercase;letter-spacing:1px;margin-bottom:2px}
.pj-meta{display:flex;justify-content:space-between;gap:8px;font-size:12.5px;font-weight:800;opacity:.9}
.pj-tm{height:10px;background:rgba(255,255,255,.2);border-radius:8px;overflow:hidden}.pj-tm i{display:block;height:100%;width:100%;background:var(--g)}.pj-tm i.low{background:#ff6b7a}
.pj-q{font-size:21px;line-height:1.3;font-weight:800;margin:2px 0}
.pj-opts{display:flex;flex-direction:column;gap:9px}
.pj-opt{display:flex;align-items:center;gap:14px;background:#fff;color:#111;border:3px solid transparent;border-radius:14px;padding:12px 14px;font-size:17.5px;font-weight:600;text-align:left;cursor:pointer;min-height:58px;font-family:inherit;width:100%;transition:background .2s}
.pj-opt .l{flex:none;width:36px;height:36px;border-radius:50%;background:var(--dg);color:#fff;display:grid;place-items:center;font-weight:800}
.pj-opt:active:not(:disabled){transform:scale(.98)}.pj-opt.sel{background:#d8ecb0;border-color:var(--g)}.pj-opt.sel .l{background:#000;color:var(--g)}.pj-opt.dim{opacity:.45}
.pj-opt.ok{background:var(--g);border-color:#fff;opacity:1}.pj-opt.ok .l{background:#000;color:var(--g)}
.pj-opt.bad{background:#ffd5da;border-color:var(--red);opacity:1}.pj-opt.bad .l{background:var(--red)}
.pj-st{text-align:center;font-weight:800;color:var(--g);min-height:20px}
.pj-fb{border-radius:14px;padding:12px 16px;display:flex;flex-direction:column;gap:4px;font-size:15.5px;line-height:1.35;animation:up .35s both}
.pj-fb.ok{background:var(--g);color:#000}.pj-fb.no{background:#fff;color:#111;border:3px solid var(--red)}
.pj-fb b{font-size:20px}.pj-fb .pj-ca{font-weight:800;color:var(--dg)}.pj-fb small{opacity:.75;font-weight:700;margin-top:2px}
.pj-top3{background:rgba(255,255,255,.12);border-radius:14px;padding:12px 16px;width:100%;text-align:left;font-size:17px}.pj-top3 small{display:block;font-size:12px;text-transform:uppercase;letter-spacing:1px;opacity:.8;margin-bottom:4px}.pj-top3 div{padding:3px 0}.pj-top3 span{float:right;font-weight:800;color:var(--g)}
body.fluid{overflow:auto}
body.fluid #viewport{overflow-y:auto}
body.fluid #stage{position:relative;left:0;top:0;width:100%;height:auto;transform:none!important;box-shadow:none}
body.fluid .slide{position:relative;inset:auto;min-height:calc(100vh - 50px);padding:22px 16px 46px;overflow:visible}
body.fluid .grid,body.fluid .steps,body.fluid .cmp,body.fluid .row2,body.fluid .qgrid,body.fluid .popts,body.fluid .cgrid,body.fluid .dj,body.fluid .kpis,body.fluid .rules{grid-template-columns:1fr}
body.fluid .hd h2{font-size:25px}body.fluid .hd.q h2{font-size:22px}body.fluid .tl{grid-template-columns:1fr 1fr;gap:14px}body.fluid .tl::before{display:none}
body.fluid .sec .row{flex-direction:column;align-items:flex-start;gap:6px}body.fluid .sec .big{font-size:90px}body.fluid .sec h1,body.fluid .cover h1{font-size:30px}
body.fluid .ft{left:16px;right:16px;font-size:9px}body.fluid .tb{display:block;overflow-x:auto}body.fluid .flow{flex-direction:column}body.fluid .flow .ar{transform:rotate(90deg)}
body.fluid .opt{font-size:16px}body.fluid .ev h3{font-size:21px}body.fluid .podium .pc2{width:96px}
</style>
</head>
<body>
<div id="app">
  <div id="pbar"><i></i></div>
  <div id="viewport"><div id="stage"></div></div>
  <div id="ctrl">
    <button id="bMenu" title="Agenda (M)">☰ Agenda</button>
    <div class="ttl"><b>BPS</b> · Impuesto a la Renta: de la contabilidad a la RLI</div>
    <button id="bPrev" title="Anterior (←)">◀</button><span id="cnt">1 / 1</span><button id="bNext" title="Siguiente (→)">▶</button>
    <button id="bFull" title="Pantalla completa (F)">⛶</button>
  </div>
</div>
<div id="menu"></div>
<script>
/* ================= Utilidades ================= */
const $=(s,r=document)=>r.querySelector(s),$$=(s,r=document)=>[...r.querySelectorAll(s)];
const FOOT='BPS · Business Process Solutions · 23 de noviembre de 2026 · Preparado por Rodrigo Eduardo Adasme Loyola, Senior Manager BPS';
const L='ABCDEFGH';
const fmt=n=>Math.round(n).toLocaleString('es-CL');
const SECS=['','Normativa: dónde está escrito','Teoría: contabilidad ≠ tributario','Los 5 cuadros de la renta','La Renta Líquida Imponible (RLI)','Gastos rechazados: art. 21 (IU 40%)','Partidas especiales','Impuesto diferido','Capital Propio Tributario (CPT)','Registro de Rentas Empresariales (RRE)','Razonabilidad del CPT','Reforma tributaria (Ley 21.850)','Declaraciones juradas clave','Evaluación final','Cierre'];
const slides=[];
const S=o=>slides.push(o);
/* ----- constructores de HTML ----- */
const HD=(t,k,q)=>`<div class="hd${q?' q':''}">${k?`<span class="kick">${k}</span><br>`:''}<h2>${t}</h2></div>`;
const BODY=h=>`<div class="body">${h}</div>`;
const card=(c,cls='')=>`<div class="card rv ${cls}">${c.n?`<div class="nn">${c.n}</div>`:''}<h4>${c.t}</h4>${c.p?`<p>${c.p}</p>`:''}${c.l?`<ul>${c.l.map(x=>`<li>${x}</li>`).join('')}</ul>`:''}</div>`;
const grid=(arr,c,cls)=>`<div class="grid" style="--c:${c}">${arr.map(x=>card(x,x.c||cls||'')).join('')}</div>`;
const steps=(arr,c)=>`<div class="steps" style="--c:${c||arr.length}">${arr.map((s,i)=>`<div class="step rv"><div class="nn">${s[0]}</div><h4>${s[1]}</h4><p>${s[2]}</p></div>`).join('')}</div>`;
const note=(h,lt)=>`<div class="note rv${lt?' lt':''}"><i class="b">!</i><div>${h}</div></div>`;
const tbl=(head,rows,o={})=>`<table class="tb rv${rows.length>=4?' fill':''}"><thead><tr>${head.map((h,i)=>`<th class="${o.c&&o.c.includes(i)?'c':''}">${h}</th>`).join('')}</tr></thead><tbody>${rows.map(r=>`<tr class="${r.tot?'tot':''}">${(r.tot?r.cells:r).map((c,i)=>`<td class="${o.c&&o.c.includes(i)?'c':''}">${c}</td>`).join('')}</tr>`).join('')}</tbody></table>`;
const cmp=(a,b,ac,bc)=>`<div class="cmp">${[[a,ac||'dk'],[b,bc||'hl']].map(([x,cl])=>`<div class="card rv ${cl}"><h4>${x[0]}</h4><ul>${x[1].map(i=>`<li>${i}</li>`).join('')}</ul></div>`).join('')}</div>`;
const partida=(id,t,fin,trib,rli,idp,extra)=>S({id,t,h:`<section class="slide">${HD(t)}${BODY(cmp(['FINANCIERO (NIIF)',fin],['TRIBUTARIO (LIR)',trib])+`<div class="row2"><div class="card rv gn"><h4>Efecto en la RLI</h4><p>${rli}</p></div><div class="card rv"><h4>¿Genera impuesto diferido?</h4><p>${idp}</p></div></div>`+(extra||''))}</section>`});
const sec=(n,t,s)=>S({sec:n,id:'s'+n,t:'Sección '+String(n).padStart(2,'0')+' · '+t,h:`<section class="slide black sec"><div class="row"><div class="big rv">${String(n).padStart(2,'0')}</div><div><h1 class="rv">${t}</h1><p class="rv">${s}</p></div></div></section>`});
const H=(id,t,inner,cls='')=>S({id,t,h:`<section class="slide ${cls}">${inner}</section>`});
const LM={a:'🟩'};

/* ================= Motor ================= */
let cur=0;const stage=$('#stage'),byId={};
function render(){
 slides.forEach((o,i)=>{
  let html;
  if(o.h)html=o.h;
  else if(o.type==='quiz')html=`<section class="slide dark">${HD(o.q,o.k||'QUIZ',1)}${BODY(`<div class="qgrid">${o.opts.map((x,j)=>`<button class="opt rv" data-j="${j}"><span class="l">${L[j]}</span><span>${x}</span></button>`).join('')}</div><div class="fb"></div>`)}</section>`;
  else if(o.type==='class')html=`<section class="slide dark">${HD(o.q,o.k||'JUEGO',1)}${BODY(`<div class="cbar"><span class="sc">0 / ${o.items.length}</span><span style="font-size:15px;opacity:.9">${o.hint||'Elige una opción en cada fila.'}</span><span class="sp"></span><button class="btn ghost rst" type="button">↺ Reiniciar</button></div><div class="cgrid" style="--c:${o.c||2}">${o.items.map((it,j)=>`<div class="crow rv" data-a="${it[1]}"><div class="ct">${j+1}. ${it[0]}</div><div class="chips">${o.opts.map((p,k)=>`<button class="chip" type="button" data-j="${k}">${p}</button>`).join('')}</div></div>`).join('')}</div><div class="fb"></div>`)}</section>`;
  else if(o.type==='poll')html=`<section class="slide dark">${HD(o.q,o.k||'ENCUESTA',1)}${BODY(`<div style="font-size:15px;opacity:.9">${o.hint||'Haz clic en una alternativa por cada mano levantada: la barra se actualiza en vivo.'}</div><div class="popts">${o.opts.map((x,j)=>`<div class="popt rv" data-j="${j}"><span class="l">${L[j]}</span><span class="pt">${x}</span><span class="pc">0 · 0%</span><span class="bar"><i></i></span></div>`).join('')}</div><div class="cbar"><span class="sc ptot">0 votos</span>${o.a!=null?'<button class="btn rvl" type="button">Revelar respuesta</button>':''}<button class="btn ghost rst" type="button">↺ Reiniciar votos</button></div><div class="fb"></div>`)}</section>`;
  const wrap=document.createElement('div');wrap.innerHTML=html.trim();
  const el=wrap.firstElementChild;el.dataset.i=i;
  const f=document.createElement('div');f.className='ft';f.innerHTML=`<span>${FOOT}</span><span>${i+1}</span>`;
  if(!/cover/.test(el.className))el.appendChild(f);else{f.style.color='rgba(255,255,255,.5)';el.appendChild(f)}
  stage.appendChild(el);o.el=el;if(o.id)byId[o.id]=i;
  $$('.rv',el).forEach((n,k)=>n.style.setProperty('--i',k));
  if(o.type==='quiz')initQuiz(el,o);if(o.type==='class')initClass(el,o);if(o.type==='poll')initPoll(el,o);
  if(o.init)o.init(el);
 });
}
function go(i){i=Math.max(0,Math.min(slides.length-1,i));slides[cur].el.classList.remove('on');cur=i;slides[cur].el.classList.add('on');if(slides[cur].onShow)slides[cur].onShow();
 $('#cnt').textContent=(i+1)+' / '+slides.length;$('#pbar i').style.width=((i+1)/slides.length*100)+'%';
 history.replaceState(null,'','#'+(i+1));$$('#menu a').forEach(a=>a.classList.toggle('cur',+a.dataset.i===i));
 const sc=$('.ev-scroll',slides[cur].el);if(sc)sc.scrollTop=0}
function fit(){const vp=$('#viewport');const fl=innerWidth<820;document.body.classList.toggle('fluid',fl);if(fl){stage.style.transform='';return}
 const s=Math.min(vp.clientWidth/1280,vp.clientHeight/720);stage.style.transform=`translate(-50%,-50%) scale(${s})`}
function buildMenu(){let h='<div class="mh">Agenda · Impuesto a la Renta</div>',last=-1;
 slides.forEach((o,i)=>{if(o.sec){h+=`<h6 data-i="${i}">${String(o.sec).padStart(2,'0')} · ${SECS[o.sec]}</h6>`}else if(i===0){h+='<h6>Inicio</h6>'}
  if(!o.sec)h+=`<a data-i="${i}">${o.t||'Lámina '+(i+1)}</a>`});$('#menu').innerHTML=h}

/* ================= Componentes interactivos ================= */
function initQuiz(el,o){const fb=$('.fb',el);let locked=false;
 const reset=()=>{locked=false;fb.innerHTML='';$$('.opt',el).forEach(b=>b.className='opt')};
 $$('.opt',el).forEach(b=>b.addEventListener('click',()=>{if(locked)return;locked=true;const j=+b.dataset.j,ok=j===o.a;
  $$('.opt',el).forEach((x,k)=>{x.classList.add('lock');if(k===o.a)x.classList.add('ok');else if(k===j)x.classList.add('bad');else x.classList.add('dim')});
  fb.innerHTML=`<div class="res ${ok?'':'no'}">${ok?'✔ ¡Correcto!':'✘ Casi. La respuesta es la '+L[o.a]}</div><div class="exp"><i class="b" style="flex:none;width:30px;height:30px;border-radius:50%;background:var(--g);color:#000;display:grid;place-items:center;font-style:normal;font-weight:800">✓</i><div>${o.exp}</div><button class="btn ghost" type="button" style="margin-left:auto;color:#fff;white-space:nowrap">↺ Reintentar</button></div>`;
  $('.btn',fb).addEventListener('click',reset)}))}
function initClass(el,o){const rows=$$('.crow',el),sc=$('.sc',el),fb=$('.fb',el);let ok=0,n=0;
 const draw=()=>{sc.textContent=ok+' / '+o.items.length;if(n===o.items.length){fb.innerHTML=`<div class="exp"><i class="b" style="flex:none;width:30px;height:30px;border-radius:50%;background:var(--g);color:#000;display:grid;place-items:center;font-style:normal;font-weight:800">★</i><div><b class="r">${ok===n?'¡Perfecto!':ok>=n*.7?'¡Muy bien!':'Buen intento.'}</b> Acertaste ${ok} de ${n}. ${o.exp||''}</div></div>`}else fb.innerHTML=''};
 rows.forEach(r=>$$('.chip',r).forEach(c=>c.addEventListener('click',()=>{if(r.classList.contains('done'))return;const j=+c.dataset.j,a=+r.dataset.a;r.classList.add('done');n++;
  if(j===a){c.classList.add('ok');r.classList.add('ok');ok++}else{c.classList.add('bad');r.classList.add('bad');$$('.chip',r)[a].classList.add('show')}draw()})));
 $('.rst',el).addEventListener('click',()=>{ok=0;n=0;rows.forEach(r=>{r.className='crow';$$('.chip',r).forEach(c=>c.className='chip')});draw()})}
function initPoll(el,o){const cnt=o.opts.map(()=>0),rows=$$('.popt',el),fb=$('.fb',el);
 const draw=()=>{const t=cnt.reduce((a,b)=>a+b,0);rows.forEach((r,i)=>{const p=t?Math.round(cnt[i]*100/t):0;$('.bar i',r).style.width=p+'%';$('.pc',r).textContent=cnt[i]+' · '+p+'%'});$('.ptot',el).textContent=t+(t===1?' voto':' votos')};
 rows.forEach((r,i)=>r.addEventListener('click',()=>{cnt[i]++;draw()}));
 $('.rst',el).addEventListener('click',()=>{cnt.fill(0);draw();rows.forEach(r=>r.classList.remove('ok'));fb.innerHTML=''});
 const rv=$('.rvl',el);if(rv)rv.addEventListener('click',()=>{rows.forEach((r,i)=>r.classList.toggle('ok',i===o.a));fb.innerHTML=`<div class="exp"><i class="b" style="flex:none;width:30px;height:30px;border-radius:50%;background:var(--g);color:#000;display:grid;place-items:center;font-style:normal;font-weight:800">✓</i><div>${o.exp}</div></div>`})}
document.addEventListener('click',e=>{
 const t=e.target.closest('.tab');if(t){const w=t.closest('.tw');$$('.tab',w).forEach(x=>x.classList.toggle('on',x===t));$$('.pane',w).forEach(p=>p.classList.toggle('on',p.dataset.i===t.dataset.i));return}
 const h=e.target.closest('.hint');if(h){h.classList.toggle('open');return}
 const oa=e.target.closest('[data-openall]');if(oa){$$('.hint',oa.closest('.slide')).forEach(x=>x.classList.add('open'));return}
 const g=e.target.closest('[data-go]');if(g){go(byId[g.dataset.go]);return}
 const ck=e.target.closest('.chk');if(ck){ck.classList.toggle('on');const s=ck.closest('.slide'),a=$$('.chk',s),n=a.filter(x=>x.classList.contains('on')).length;$('.prog i',s).style.width=(n/a.length*100)+'%';$('.pg',s).textContent=n+' de '+a.length+' puntos revisados'+(n===a.length?' ✔ ¡Listo para entregar!':'');return}
 const mi=e.target.closest('#menu a,#menu h6[data-i]');if(mi){go(+mi.dataset.i);$('#menu').classList.remove('open')}
});
/* ================= Contenido ================= */
const tabs=(labels,panes)=>`<div class="tw rv"><div class="tabs">${labels.map((l,i)=>`<button class="tab${i?'':' on'}" data-i="${i}" type="button">${l}</button>`).join('')}</div><div class="pw">${panes.map((p,i)=>`<div class="pane${i?'':' on'}" data-i="${i}">${p}</div>`).join('')}</div></div>`;
const tipsul=a=>`<ul>${a.map(x=>`<li>${x}</li>`).join('')}</ul>`;

/* 01 Portada */
H('cover','Portada',`<div class="dot">%</div><h1 class="rv">Impuesto a la Renta: de la contabilidad a la RLI</h1><div class="sub rv">BPS · Business Process Solutions · Consultores y Analistas · 23 de noviembre de 2026</div><div class="by rv">Preparado por: <b>Rodrigo Eduardo Adasme Loyola · Senior Manager BPS</b></div><div class="tags rv">RLI · Art. 21 · CPT · RRE · Razonabilidad · Impuesto diferido · Reforma · DJ</div>`,'black cover');
S({type:'poll',id:'enc1',t:'Encuesta: ¿cuántas rentas has preparado?',k:'ENCUESTA',q:'¿Cuántas rentas anuales has preparado tú?',opts:['Ninguna, hoy es mi primera vez','Una, con mucha ayuda','Varias, pero me quedan dudas','Muchas: ¡yo podría dar esta charla!'],hint:'Rompehielo: haz clic en una alternativa por cada mano levantada y mira cómo se reparte la sala.'});
H('obj','¿Qué nos llevamos hoy?',HD('¿Qué nos llevamos hoy?')+BODY(grid([
 {n:'1',t:'Ubicar la norma',p:'Saber en qué ley y artículo está cada regla que aplicamos.'},{n:'2',t:'Pensar en dos mundos',p:'Distinguir el tratamiento financiero (NIIF) del tributario (LIR).'},
 {n:'3',t:'Armar la RLI',p:'Identificar agregados y deducciones partiendo del resultado contable.'},{n:'4',t:'Conectar los cuadros',p:'Entender cómo la RLI alimenta el CPT, el RRE y la razonabilidad.'},
 {n:'5',t:'Calcular el impuesto diferido',p:'Saber por qué existe y cómo cambia con la reforma.'},{n:'6',t:'Aplicar el art. 21',p:'Reconocer los gastos rechazados y cuándo pagan el 40%.'},
 {n:'7',t:'Conocer las DJ clave',p:'Saber qué informa cada DJ y qué validar.'},{n:'8',t:'Entregar con calidad',p:'Preparar un papel de trabajo ordenado, trazable y fácil de revisar.'}],4)));
H('agenda','Agenda',HD('Agenda · toca un módulo para ir directo')+BODY(`<div class="grid" style="--c:2;gap:10px 22px">${SECS.slice(1).map((s,i)=>`<div class="card rv" data-go="s${i+1}" style="cursor:pointer;display:flex;flex-direction:row;gap:16px;align-items:center;justify-content:flex-start;padding:9px 18px;${i>=12?'background:#000;color:#fff':''}"><span class="nn" style="margin:0;align-self:center">${String(i+1).padStart(2,'0')}</span><span style="font-size:17px;font-weight:600">${s}</span></div>`).join('')}</div>`));
H('part','Cómo vamos a participar',HD('Cómo vamos a participar')+BODY(grid([
 {t:'Preguntas a la sala',p:'Durante la charla haré preguntas: responde quien levante la mano o a quien yo invite. Sin puntaje: equivocarse acá es parte de aprender.'},
 {t:'Actividades interactivas',p:'Encuestas, quiz, “¿agregado o deducción?”, verdadero o falso y casos: haz clic en las alternativas y recibe la corrección al instante.'},
 {t:'Evaluación final con ranking',l:['Quiz de 26 preguntas, en vivo, dentro de esta misma presentación','Escaneas un QR con tu celular y escribes tu nombre','Todos juegan al mismo tiempo, contra el reloj','Podio en vivo con los ganadores'],c:'hl'}],3)+`<div class="note rv"><i class="b">💡</i><div><b>No hay preguntas tontas:</b> si tienes una duda, seguro alguien más la tiene. Equivocarse acá es gratis; equivocarse en la renta del cliente, no.</div></div>`));

 let st={name:'',i:0,score:0,ok:0,left:30,lock:true,timer:null,cur:null,mode:'intro'};
 const TOT=QS.length,TM=30;
 function intro(){st.mode='intro';clearInterval(st.timer);root.innerHTML=`<div class="ev-scroll" style="overflow:auto;flex:1"><div style="font-size:20px;line-height:1.45;max-width:900px">Modo individual: responde ${TOT} preguntas en este mismo computador. Más rápido y correcto = más puntos (hasta 1.000 por pregunta).</div><label style="display:block;margin-top:14px;font-weight:800;font-size:15px">Tu nombre y apellido<br><input type="text" id="evn" maxlength="40" placeholder="Ej.: Ana Pérez" autocomplete="off"></label><div><button class="btn" id="evgo" type="button" style="font-size:18px;padding:12px 36px;background:var(--g)">▶ Comenzar</button> <button class="btn ghost" id="evlb" type="button" style="margin-left:10px">🏆 Ver ranking</button>${onBack?'<button class="btn ghost" id="evback" type="button" style="margin-left:10px">← Sala en vivo</button>':''}</div></div>`;
  const inp=$('#evn',root);const start=()=>{const n=inp.value.trim();if(n.length<3){inp.style.borderColor='#ff6b7a';inp.focus();return}st.name=n;st.i=0;st.score=0;st.ok=0;st.Q=QS.map(q=>prep(q));next()};
  $('#evgo',root).onclick=start;inp.addEventListener('keydown',e=>{if(e.key==='Enter')start()});$('#evlb',root).onclick=()=>board(null);if(onBack)$('#evback',root).onclick=onBack}
 function prep(q){let o,a;if(q.art!=null){const wrong=shuffle(ART.filter((x,i)=>i!==q.art)).slice(0,3).map(x=>x[1]);o=[ART[q.art][1],...wrong];a=0}else{o=q.o.slice();a=q.a}
  if(q.fix)return{...q,o,a,idx:o.map((_,i)=>i)};
  const idx=shuffle(o.map((_,i)=>i));return{...q,o:idx.map(i=>o[i]),a:idx.indexOf(a)}}
 function next(){if(st.i>=TOT)return end();const q=st.Q[st.i];st.cur=q;st.mode='q';st.lock=false;st.left=TM;
  root.innerHTML=`<div class="top"><span class="rd">${q.r}</span><span>Pregunta ${st.i+1} de ${TOT}</span><span class="sp"></span><span class="pts">${fmt(st.score)} pts</span><span>${esc(st.name)}</span></div><div class="tm"><i></i></div><h3>${q.q}</h3><div class="qgrid">${q.o.map((x,j)=>`<button class="opt" type="button" data-j="${j}"><span class="l">${L[j]}</span><span>${x}</span></button>`).join('')}</div><div class="fb" style="margin-top:14px"></div>`;
  if(q.o.length<=3)$('.qgrid',root).style.gridTemplateColumns='1fr';
  $$('.opt',root).forEach(b=>b.addEventListener('click',()=>answer(+b.dataset.j)));
  clearInterval(st.timer);st.timer=setInterval(()=>{if(!el.classList.contains('on')||st.mode!=='q'||st.lock)return;st.left=Math.max(0,st.left-.1);const bar=$('.tm i',root);if(bar){bar.style.width=(st.left/TM*100)+'%';bar.classList.toggle('low',st.left<8)}if(st.left<=0)answer(-1)},100)}
 function answer(j){if(st.lock)return;st.lock=true;clearInterval(st.timer);const q=st.cur,ok=j===q.a;let pts=0;if(ok){pts=Math.round(500+500*st.left/TM);st.score+=pts;st.ok++}
  $$('.opt',root).forEach((x,k)=>{x.classList.add('lock');if(k===q.a)x.classList.add('ok');else if(k===j)x.classList.add('bad');else x.classList.add('dim')});
  $('.fb',root).innerHTML=`<div class="res ${ok?'':'no'}">${ok?'✔ ¡Correcto! +'+pts+' puntos':(j<0?'⏱ Se acabó el tiempo':'✘ Incorrecto')}</div><div class="exp"><div>${q.e}</div><button class="btn" id="evnx" type="button" style="margin-left:auto;white-space:nowrap">${st.i+1>=TOT?'Ver resultados →':'Siguiente →'}</button></div>`;
  $('.pts',root).textContent=fmt(st.score)+' pts';st.mode='fb';$('#evnx',root).onclick=()=>{st.i++;next()}}
 function end(){clearInterval(st.timer);st.mode='end';const r={n:st.name,s:st.score,k:st.ok,t:Date.now()};save(r);board(r)}
 function board(me){st.mode='end';clearInterval(st.timer);const all=mem.slice().sort((a,b)=>b.s-a.s||a.t-b.t),top=all.slice(0,3),pos=me?all.findIndex(x=>x.t===me.t)+1:0;
  const pod=[1,0,2].map(i=>top[i]?`<div class="pc2 p${i+1}"><div class="nm">${esc(top[i].n)}</div><div class="bx"><big>${['🥇','🥈','🥉'][i]}</big><small>${fmt(top[i].s)} pts</small></div></div>`:'').join('');
  root.innerHTML=`<div class="ev-scroll" style="overflow:auto;flex:1">${me?`<div style="display:flex;gap:16px;align-items:center;flex-wrap:wrap;margin-bottom:8px"><div class="kpi g" style="min-width:230px"><span>${esc(me.n)}</span><b>${fmt(me.s)} pts</b></div><div class="kpi"><span>Aciertos</span><b>${me.k} / ${TOT}</b></div><div class="kpi d"><span>Puesto</span><b>${pos}° de ${all.length}</b></div><div style="flex:1;font-size:16px">${me.k>=TOT*.8?'¡Excelente! Dominas el tema.':me.k>=TOT*.5?'¡Buen trabajo! Repasa los módulos donde dudaste.':'Buen intento: revisa la presentación y vuelve a jugar.'}</div></div>`:'<div style="font-size:22px;font-weight:800;margin-bottom:6px">🏆 Ranking de este computador</div>'}
  <div class="podium">${pod||'<div style="opacity:.8;align-self:center">Aún no hay resultados. ¡Sé el primero en jugar!</div>'}</div>
  ${all.length?`<table class="lbt" style="margin-top:12px"><tr><th>#</th><th>Participante</th><th>Puntos</th><th>Aciertos</th></tr>${all.slice(0,6).map((x,i)=>`<tr class="${me&&x.t===me.t?'me':''}"><td>${i+1}</td><td>${esc(x.n)}</td><td>${fmt(x.s)}</td><td>${x.k}/${TOT}</td></tr>`).join('')}</table>`:''}
  <div style="margin-top:14px;display:flex;gap:10px;flex-wrap:wrap"><button class="btn" id="evnew" type="button">▶ Nuevo participante</button><button class="btn ghost" id="evclr" type="button">Borrar ranking</button>${onBack?'<button class="btn ghost" id="evback" type="button">← Sala en vivo</button>':''}</div></div>`;
  if(onBack)$('#evback',root).onclick=onBack;$('#evnew',root).onclick=intro;$('#evclr',root).onclick=()=>{if(confirm('¿Borrar el ranking de este dispositivo?')){clear();board(null)}}}
 document.addEventListener('keydown',e=>{if(!el.classList.contains('on')||st.mode!=='q'||st.lock)return;const m={'1':0,'2':1,'3':2,'4':3,a:0,b:1,c:2,d:3}[e.key.toLowerCase()];if(m!=null&&m<st.cur.o.length){e.stopPropagation();answer(m)}},true);
 return {intro}}

/* 14 Cierre */
sec(14,'Cierre','Lo que nos llevamos');
H('lleva','Lo que nos llevamos',HD('Lo que nos llevamos')+BODY(grid([{n:'1',t:'Dos mundos',p:'Contabilidad y tributario tienen objetivos distintos: la RLI concilia ambos.'},{n:'2',t:'Siempre el porqué',p:'Cada ajuste tiene un artículo y un respaldo.'},{n:'3',t:'Temporal vs. permanente',p:'Las temporales generan impuesto diferido; las permanentes no.'},{n:'4',t:'Todo conversa',p:'RLI → CPT → RRE → razonabilidad. Si algo no cuadra, el error está en alguna parte.'},{n:'5',t:'La reforma ya llegó',p:'Nuevas tasas para el ID y cambios en el art. 107.',c:'hl'},{n:'6',t:'Art. 21 y DJ',p:'El 40% sale caro; las DJ deben conversar con el F22. Ante dudas, consulta a tu gerente.',c:'dk'}],3)+note('Cierra la sesión: <b>¿qué fue lo más útil que aprendiste hoy?</b> Dilo con tus propias palabras.',1)));
H('check','Checklist del analista',HD('Checklist del analista antes de entregar al gerente')+BODY(`<div class="grid" style="--c:2;gap:8px 16px">${['El régimen tributario y la tasa están confirmados','La RLI parte del resultado de los EEFF finales (cuadrado)','Cada agregado o deducción tiene su fundamento y su link al análisis','Las partidas del art. 21 están identificadas (con y sin 40%)','El impuesto diferido está calculado con las tasas vigentes por año de reverso','El CPT está a valor tributario y el pasivo exigible está revisado','El RRE parte del saldo aprobado del año anterior','La razonabilidad cuadra o sus diferencias están explicadas por escrito','Los PPM cuadran con los F29','Las DJ (1847, 1926, 1948, 1835, 1879, 1946) cuadran con la renta','Las dudas están listadas para el gerente'].map(x=>`<div class="chk rv"><i>✓</i>${x}</div>`).join('')}</div><div class="prog rv"><i></i></div><div class="pg" style="font-weight:800;font-size:15px">0 de 11 puntos revisados</div>`));
H('fin','Gracias',`<div style="flex:1;display:flex;flex-direction:column;justify-content:center"><h1 class="rv" style="font-size:64px;letter-spacing:-1.5px">¡Gracias! ¿Preguntas?</h1><p class="rv" style="color:var(--g);font-size:24px;margin-top:16px">Capacitación de Impuesto a la Renta · Consultores y Analistas</p><p class="rv" style="color:#aaa;font-size:16px;margin-top:22px">Viene una segunda versión de esta capacitación orientada a seniors y supervisores, con foco en revisión.</p></div>`,'black cover');

/* ================= Arranque ================= */
const JOIN=new URLSearchParams(location.search).get('j');
if(JOIN){joinMode(JOIN)}else{
render();buildMenu();fit();
addEventListener('resize',fit);
$('#bNext').onclick=()=>go(cur+1);$('#bPrev').onclick=()=>go(cur-1);
$('#bMenu').onclick=()=>$('#menu').classList.toggle('open');
$('#bFull').onclick=()=>{document.fullscreenElement?document.exitFullscreen():document.documentElement.requestFullscreen&&document.documentElement.requestFullscreen()};
addEventListener('keydown',e=>{if(/INPUT|SELECT|TEXTAREA/.test(e.target.tagName))return;
 if(e.key==='ArrowRight'||e.key==='PageDown'||(e.key===' '&&e.target===document.body)){e.preventDefault();go(cur+1)}
 else if(e.key==='ArrowLeft'||e.key==='PageUp'){e.preventDefault();go(cur-1)}
 else if(e.key==='Home')go(0);else if(e.key==='End')go(slides.length-1);
 else if(e.key==='f'||e.key==='F')$('#bFull').click();else if(e.key==='m'||e.key==='M')$('#menu').classList.toggle('open');
 else if(e.key==='Escape')$('#menu').classList.remove('open')});
let tx=null;addEventListener('touchstart',e=>{tx=e.touches[0].clientX},{passive:true});
addEventListener('touchend',e=>{if(tx==null)return;const d=e.changedTouches[0].clientX-tx;if(Math.abs(d)>70&&!e.target.closest('input,select,.tb'))go(cur+(d<0?1:-1));tx=null},{passive:true});
document.addEventListener('click',e=>{if(!e.target.closest('#menu,#bMenu'))$('#menu').classList.remove('open')});
go(Math.max(0,Math.min(slides.length-1,(parseInt(location.hash.slice(1))||1)-1)));
}

</script>
